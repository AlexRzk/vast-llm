name: Shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check
        run: bash -n vast-llm && bash -n vast-llm-launcher && bash -n vast-llm-entry && bash -n vast-llm-bench && bash -n vast-llm-doctor && bash -n vast-llm-auto && bash -n install.sh
      - name: Shellcheck errors
        run: shellcheck -S error -x vast-llm vast-llm-launcher vast-llm-entry vast-llm-bench vast-llm-doctor vast-llm-auto install.sh
      - name: Shellcheck advisory report
        continue-on-error: true
        run: shellcheck -x vast-llm vast-llm-launcher vast-llm-entry vast-llm-bench vast-llm-doctor vast-llm-auto install.sh
